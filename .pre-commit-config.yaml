repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all -- --check
        language: system
        always_run: true
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        always_run: true
        pass_filenames: false
      - id: slint-build
        name: Slint and Rust build check
        entry: cargo check --all-targets --all-features
        language: system
        always_run: true
        pass_filenames: false
